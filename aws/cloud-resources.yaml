AWSTemplateFormatVersion: '2010-09-09'
Description: Dedicated AWS resources for the UCS531 hybrid scheduler
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC for the worker
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet in that VPC with outbound HTTPS connectivity
  AssignPublicIpv4:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Use true for a subnet routed to an internet gateway or false for a subnet with NAT
  OperatorPrincipalArn:
    Type: String
    Description: Existing AWS operator principal authorized to assume the two lab roles
  WorkerAmi:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  WorkerInstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.micro, t3.small, t3.medium, t3a.micro, t3a.small, t3a.medium]
  LogGroupName:
    Type: String
    Default: /ucs531/scheduler
    Description: Match the Name parameter of the observability stack
  MetricNamespace:
    Type: String
    Default: UCS531/Scheduler
    Description: Match the Namespace parameter of the observability stack
Conditions:
  UsePublicIpv4: !Equals [!Ref AssignPublicIpv4, 'true']
  RootOperator: !Equals [!Ref OperatorPrincipalArn, !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root']
Resources:
  Artifacts:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  ArtifactsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Artifacts
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt Artifacts.Arn
              - !Sub '${Artifacts.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'
  WorkerImages:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ImageTagMutability: IMMUTABLE
  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Policies:
        - PolicyName: WorkerServices
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LogGroupName}:log-stream:ec2-1'
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
                Resource: !GetAtt WorkerImages.Arn
  WorkerProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref WorkerRole]
  WorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Outbound HTTPS for the project worker
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  WorkerLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        CreditSpecification:
          CpuCredits: standard
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 1
  WorkerInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref WorkerAmi
      InstanceType: !Ref WorkerInstanceType
      IamInstanceProfile: !Ref WorkerProfile
      InstanceInitiatedShutdownBehavior: stop
      LaunchTemplate:
        LaunchTemplateId: !Ref WorkerLaunchTemplate
        Version: !GetAtt WorkerLaunchTemplate.LatestVersionNumber
      NetworkInterfaces:
        - DeviceIndex: '0'
          SubnetId: !Ref SubnetId
          AssociatePublicIpAddress: !If [UsePublicIpv4, true, false]
          DeleteOnTermination: true
          GroupSet: [!Ref WorkerSecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 12
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-worker'
        - Key: Project
          Value: UCS531
      UserData:
        Fn::Base64: |
          #!/bin/sh
          set -eu
          dnf install -y docker
          systemctl enable --now docker
  CredentialsIssuer:
    Type: AWS::IAM::User
    Condition: RootOperator
  IssuerPolicy:
    Type: AWS::IAM::Policy
    Condition: RootOperator
    Properties:
      PolicyName: IssueProjectSessions
      Users: [!Ref CredentialsIssuer]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Resource: [!GetAtt WebRole.Arn, !GetAtt ControllerRole.Arn]
  WebRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !If [RootOperator, !GetAtt CredentialsIssuer.Arn, !Ref OperatorPrincipalArn]
            Action: sts:AssumeRole
            Condition:
              ArnEquals:
                'aws:PrincipalArn': !If [RootOperator, !GetAtt CredentialsIssuer.Arn, !Ref OperatorPrincipalArn]
      Policies:
        - PolicyName: ArtifactAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource:
                  - !Sub '${Artifacts.Arn}/inputs/*'
                  - !Sub '${Artifacts.Arn}/attempts/*'
  ControllerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !If [RootOperator, !GetAtt CredentialsIssuer.Arn, !Ref OperatorPrincipalArn]
            Action: sts:AssumeRole
            Condition:
              ArnEquals:
                'aws:PrincipalArn': !If [RootOperator, !GetAtt CredentialsIssuer.Arn, !Ref OperatorPrincipalArn]
      Policies:
        - PolicyName: SchedulerCapacity
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ec2:DescribeInstances
                Resource: '*'
                Condition:
                  StringEquals:
                    'aws:RequestedRegion': !Ref AWS::Region
              - Effect: Allow
                Action: [ec2:StartInstances, ec2:StopInstances]
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${WorkerInstance}'
              - Effect: Allow
                Action: logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LogGroupName}:log-stream:controller'
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    'cloudwatch:namespace': !Ref MetricNamespace
Outputs:
  ArtifactBucket:
    Value: !Ref Artifacts
  InstanceId:
    Value: !Ref WorkerInstance
  ImageRepository:
    Value: !GetAtt WorkerImages.RepositoryUri
  WebRoleArn:
    Value: !GetAtt WebRole.Arn
  ControllerRoleArn:
    Value: !GetAtt ControllerRole.Arn
  CredentialsIssuer:
    Condition: RootOperator
    Value: !Ref CredentialsIssuer
  Account:
    Value: !Ref AWS::AccountId
