name: cloud-qos-scheduler

x-lab: &lab
  image: ucs531/qos-lab:local
  build:
    context: .
    target: lab
  env_file: .env
  environment:
    DATABASE_URL: postgresql://scheduler:${POSTGRES_PASSWORD}@db:5432/scheduler
  depends_on:
    db:
      condition: service_healthy

x-worker: &worker
  image: ucs531/qos-worker:local
  build:
    context: .
    target: worker
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  cpus: ${LOCAL_WORKER_CPUS:-1.0}
  mem_limit: 512m
  depends_on:
    - web

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run env:init first}
      POSTGRES_DB: scheduler
    healthcheck:
      test: [CMD, pg_isready, -U, scheduler, -d, scheduler]
      interval: 3s
      timeout: 3s
      retries: 12
    volumes:
      - database:/var/lib/postgresql/data

  migrate:
    <<: *lab
    command: [npm, run, 'db:init']

  web:
    <<: *lab
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - artifacts:/app/.data/artifacts
    restart: unless-stopped

  scheduler:
    <<: *lab
    command: [npm, run, scheduler]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  local-1:
    <<: *worker
    environment:
      WORKER_ID: local-1
      WORKER_TOKEN: ${WORKER_TOKEN_LOCAL_1:?Set WORKER_TOKEN_LOCAL_1}
      WORKER_API_URL: http://web:3000

  local-2:
    <<: *worker
    environment:
      WORKER_ID: local-2
      WORKER_TOKEN: ${WORKER_TOKEN_LOCAL_2:?Set WORKER_TOKEN_LOCAL_2}
      WORKER_API_URL: http://web:3000

volumes:
  database:
  artifacts:
